[package]
name = "mangodisk"
version.workspace = true
description = "MangoDisk cross-platform disk space manager"
authors = ["harry0703"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mangodisk_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
portable = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1"
log = "0.4.33"
mangodisk-core = { path = "crates/mangodisk-core" }
mangodisk-platform = { path = "crates/mangodisk-platform" }
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-prevent-default = { version = "2.1", features = ["unstable-windows"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.4"
plist = "1.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
