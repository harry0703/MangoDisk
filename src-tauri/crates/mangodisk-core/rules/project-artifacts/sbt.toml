id = "project.sbt-build-artifacts"
schema_version = 1
rule_version = 1
platforms = ["macos", "windows", "linux"]
category = "development"
risk = "recoverable"
default_selected = false

[match]
file_names_any = ["build.sbt"]

[[artifacts]]
kind = "relativeDirectory"
path = "target"

[[artifacts]]
kind = "relativeDirectory"
path = "project/target"

[verification]
lifecycle = "verified"
evidence = ["https://www.scala-sbt.org/1.x/docs/Running.html#Common+commands"]
verified_at = "2026-07-31"
