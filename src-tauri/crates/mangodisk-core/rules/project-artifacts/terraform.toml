id = "project.terraform-build-artifacts"
schema_version = 1
rule_version = 1
platforms = ["macos", "windows", "linux"]
category = "development"
risk = "recoverable"
default_selected = false

[match]
file_names_any = [".terraform.lock.hcl"]

[[artifacts]]
kind = "relativeDirectory"
path = ".terraform"

[verification]
lifecycle = "verified"
evidence = ["https://developer.hashicorp.com/terraform/cli/init#working-directory-contents"]
verified_at = "2026-07-31"
