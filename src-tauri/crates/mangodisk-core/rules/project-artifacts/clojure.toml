id = "project.clojure-cli-cache"
schema_version = 1
rule_version = 1
platforms = ["macos", "windows", "linux"]
category = "development"
risk = "recoverable"
default_selected = false

[match]
file_names_any = ["deps.edn"]

[[artifacts]]
kind = "relativeDirectory"
path = ".cpcache"

[verification]
lifecycle = "verified"
evidence = ["https://clojure.org/reference/clojure_cli"]
verified_at = "2026-07-18"
