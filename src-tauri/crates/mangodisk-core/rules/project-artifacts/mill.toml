id = "project.mill-build-artifacts"
schema_version = 1
rule_version = 1
platforms = ["macos", "windows", "linux"]
category = "development"
risk = "recoverable"
default_selected = false

[match]
file_names_any = ["build.mill", "build.mill.yaml", "build.sc"]

[[artifacts]]
kind = "relativeDirectory"
path = "out"

[verification]
lifecycle = "verified"
evidence = ["https://mill-build.org/mill/fundamentals/out-dir.html"]
verified_at = "2026-07-18"
