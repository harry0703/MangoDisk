id = "system.font-cache"
schema_version = 3
rule_version = 1
platform = "linux"
category = "system"
risk = "safe"
default_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${home}/.cache/fontconfig"

[[roots]]
template = "${home}/.cache/glyph-cache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "Fontconfig and glyph caches are regenerated by fc-cache and pango; removing them forces a rebuild without affecting installed fonts"
verified_at = "2026-09-17"
verified_platform = "linux"
references = ["https://www.freedesktop.org/wiki/Software/fontconfig/"]
