id = "app.vesktop-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "recoverable"
default_selected = false
recommended_selected = false
required_stopped_processes = ["Vesktop", "Vesktop Helper", "Vesktop Helper (Renderer)", "Vesktop Helper (GPU)", "Vesktop Helper (Plugin)"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${application_support}/vesktop/sessionData/Cache"
verified_rebuildable = true

[[roots]]
template = "${application_support}/vesktop/sessionData/Code Cache"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Vesktop relocates Electron session data to sessionData. Only response and code cache leaves are selected after exit. Authentication, web storage, settings, themes and vencordFiles are retained"
verified_at = "2026-10-30"
verified_platform = "macos"
references = [
  "https://github.com/Vencord/Vesktop/blob/55987580de68d2a74a59c3121fc437a5ceccd345/src/main/constants.ts",
  "https://www.electronjs.org/docs/latest/api/session#sesclearcache",
  "https://www.electronjs.org/docs/latest/api/session#sesclearcodecachesoptions",
]
