# NetEase Cloud Music keeps the local library, downloaded media, account data,
# and Chromium persistence beside one fixed renderer profile. The top-level
# Cache directory is owned separately by the opt-in playback cache rule.
id = "app.netease-cloud-music-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["cloudmusic.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["NetEase Cloud Music", "CloudMusic", "NetEase (Hangzhou) Network Co., Ltd"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/Cache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/Code Cache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/GPUCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/DawnCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/DawnGraphiteCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/DawnWebGPUCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/GrShaderCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/GraphiteDawnCache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/Shared Dictionary/cache"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/webapp91x64/Crashpad/reports"

[[roots]]
template = "${local_app_data}/NetEase/CloudMusic/Log"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Hash-matched NetEase 3.1.37.205354 installer passed Authenticode verification. Real renderer and log roots were reproduced; audio cache, library, downloads, cookies, browser storage, local data, dumps, and binaries remain excluded"
verified_at = "2026-08-11"
verified_platform = "windows"
references = [
  "https://music.163.com/#/download",
  "https://github.com/microsoft/winget-pkgs/tree/master/manifests/n/NetEase/CloudMusic/3.1.37.205354",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]
