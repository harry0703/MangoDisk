name: build-macos-legacy

# 构建兼容 macOS 10.13 (2013 iMac, x86_64) 的 DMG / .app。
#
# Tauri 的 macOS bundler 依赖 hdiutil/ditto/codesign 等 macOS 专属工具，
# 无法从 Windows 交叉编译，因此必须在 macOS 环境构建。
#
# runner 选择（重要）：
#   GitHub 已于 2025-12-04 全面下线 macos-13（Intel）。目前唯一可用的 Intel
#   macOS runner 是 macos-15-intel（可用至 2027-08）。
#   2013 iMac 是 x86_64 架构，必须用 Intel runner 产出原生 x86_64 产物；
#   macos-15 / macos-latest 是 arm64，交叉编译 x86_64 虽可行，但 DMG 打包链路
#   更容易出意外。
#
# 用法：
#   1. 把你的代码 push 到 GitHub 仓库（fork 或自己的仓库都行）
#   2. 在 Actions 页面手动触发：Actions → build-macos-legacy → Run workflow
#   3. 构建完成后到 Artifacts 下载 mangodisk-macos-x86_64（含 DMG 和 .app）

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-x86_64:
    # macos-15-intel = Intel x86_64 runner，产物架构与 2013 iMac 一致。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup 读取 package.json 的 packageManager 字段（pnpm@11.13.1），
      # 保证与仓库锁定版本一致，避免 --frozen-lockfile 因 pnpm 主版本不同而失败。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # createUpdaterArtifacts 在 tauri.conf.json 中是 true，但没有 updater 私钥
      # 会直接让打包失败；上游的 Linux 打包脚本用同样方式覆盖掉它。
      # --no-sign 跳过 codesign，产物未签名，安装时右键打开即可。
      # beforeBuildCommand 收窄为 pnpm build:frontend，只跑前端类型检查 + vite build
      # + 产物体积预算校验，跳过 vitest / cargo test，以缩短首次出包时间。
      - name: Build macOS bundle (x86_64 — 2013 iMac)
        env:
          TAURI_CONFIG_OVERRIDE: '{"bundle":{"createUpdaterArtifacts":false},"build":{"beforeBuildCommand":"pnpm build:frontend"}}'
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg --no-sign --config "$TAURI_CONFIG_OVERRIDE"

      - name: Upload DMG / .app
        uses: actions/upload-artifact@v4
        with:
          name: mangodisk-macos-x86_64
          # cargo workspace 根在仓库根目录，产物落在 ./target，而不是 ./src-tauri/target
          path: target/x86_64-apple-darwin/release/bundle/macos/
          if-no-files-found: error
